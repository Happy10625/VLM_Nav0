# Ranger fixed-map Nav2 overlay. Static-only costmaps do not model other robots
# or other dynamic obstacles; this profile is for supervised single-robot tests.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.50
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.50
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.76
      use_final_approach_orientation: true
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /fastlio/odom
    goal_checker_plugins: [general_goal_checker]
    general_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.05
      stateful: true
    FollowPath:
      max_vel_x: 0.20
      max_vel_theta: 0.40
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.03
    progress_checker:
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    odom_topic: /fastlio/odom

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.30

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    odom_topic: /fastlio/odom
