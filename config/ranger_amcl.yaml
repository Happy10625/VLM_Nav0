# Initial Ranger fixed-map localization profile. It is not yet validated on robot.
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    laser_model_type: likelihood_field_prob
    do_beamskip: false
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    update_min_d: 0.25
    update_min_a: 0.2
    tf_broadcast: true
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server, amcl]
