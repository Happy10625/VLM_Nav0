# Derived from Ranger AMCL overlay; adds existing Ranger obstacle input.
# Original speeds, footprint, inflation, planner and controller tolerances retained.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: '[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]'
      footprint_padding: 0.03
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        observation_sources: fastlio_cloud confirmed_obstacles
        fastlio_cloud:
          topic: /vlm_nav/obstacle_cloud
          sensor_frame: body
          data_type: PointCloud2
          marking: false
          clearing: true
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          obstacle_min_range: 0.2
          obstacle_max_range: 7.5
          min_obstacle_height: 0.10
          max_obstacle_height: 1.60
        confirmed_obstacles:
          topic: /vlm_nav/confirmed_obstacle_cloud
          sensor_frame: body
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_min_range: 0.2
          obstacle_max_range: 7.5
          min_obstacle_height: 0.10
          max_obstacle_height: 1.60
        plugin: nav2_costmap_2d::ObstacleLayer
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: '[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]'
      footprint_padding: 0.03
      plugins:
      - static_layer
      - voxel_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        origin_z: -0.1
        # Cover 1.60 m within the 16-layer limit while retaining clearing below z=0.
        z_resolution: 0.11
        z_voxels: 16
        observation_sources: fastlio_cloud confirmed_obstacles
        fastlio_cloud:
          topic: /vlm_nav/obstacle_cloud
          sensor_frame: body
          data_type: PointCloud2
          marking: false
          clearing: true
          raytrace_min_range: 0.2
          raytrace_max_range: 8.0
          obstacle_min_range: 0.2
          obstacle_max_range: 7.5
          min_obstacle_height: 0.10
          max_obstacle_height: 1.60
        confirmed_obstacles:
          topic: /vlm_nav/confirmed_obstacle_cloud
          sensor_frame: body
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_min_range: 0.2
          obstacle_max_range: 7.5
          min_obstacle_height: 0.10
          max_obstacle_height: 1.60
        plugin: nav2_costmap_2d::VoxelLayer
planner_server:
  ros__parameters:
    GridBased:
      # Native target approach: 0.76 m planner + 0.05 m goal tolerance = 0.81 m.
      tolerance: 0.76
      use_final_approach_orientation: true
      allow_unknown: true
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /fastlio/odom
    min_y_velocity_threshold: 0.001
    controller_frequency: 20.0
    # Abort on the classified error before a later TF failure can replace its cause.
    failure_tolerance: 0.0
    goal_checker_plugins:
    - general_goal_checker
    general_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.05
      stateful: true
    FollowPath:
      plugin: vlm_nav::RangerDWBController
      trajectory_generator_name: vlm_nav::RangerTrajectoryGenerator
      max_vel_x: 0.2
      max_vel_theta: 0.4
      acc_lim_x: 2.5
      decel_lim_x: -2.5
      acc_lim_theta: 3.2
      decel_lim_theta: -3.2
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.03
      max_moving_angular_velocity: 0.29
      chassis_min_turn_radius: 0.47644
      heading_lookahead: 0.4
      heading_scale: 32.0
      linear_granularity: 0.01
      angular_granularity: 0.01
      critics: [ObstacleFootprint, BaseObstacle, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
    progress_checker:
      plugin: vlm_nav::RangerProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
bt_navigator:
  ros__parameters:
    use_sim_time: false
    odom_topic: /fastlio/odom
    default_nav_to_pose_bt_xml: package://vlm_nav/behavior_trees/ranger_checked_turnaround.xml
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    max_rotational_vel: 0.25
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.3
    spin:
      plugin: vlm_nav::RangerSpin
ranger_command_guard:
  ros__parameters:
    command_timeout: 1.0
    odom_topic: /odom
    odom_timeout: 0.5
