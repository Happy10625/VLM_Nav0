global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.50
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      obstacle_layer:
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /vlm_nav/filtered_obstacle_cloud
          # The PointCloud2 header is frame_id=body. Leave sensor_frame unset
          # so Nav2 Humble uses that real frame instead of also requiring the
          # nonexistent livox_frame transform at the cloud timestamp.
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

planner_server:
  ros__parameters:
    GridBased:
      # Provisional VLM standoff endpoints may be in unknown map cells.
      # The live obstacle layer and VLM endpoint revalidation still veto
      # newly observed occupied space.
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.50
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      voxel_layer:
        # FAST_LIO may place the cloud origin a few centimetres below odom z=0.
        # Cover that origin so raytracing can clear stale obstacle cells.
        origin_z: -0.10
        z_resolution: 0.10
        z_voxels: 16
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /vlm_nav/filtered_obstacle_cloud
          # Use the PointCloud2 header frame (body); livox_frame is not in TF.
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          min_obstacle_height: 0.05
          max_obstacle_height: 1.40

controller_server:
  ros__parameters:
    general_goal_checker:
      # Ignore the RViz goal arrow once the base center is within 0.25 m.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.141592653589793
      stateful: true
    FollowPath:
      max_vel_x: 0.20
      max_vel_theta: 0.40
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
    progress_checker:
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

behavior_server:
  ros__parameters:
    # Spin and other behavior collision simulations consume the filtered map.
    # Planner/controller costmaps are built from the filtered cloud above.
    costmap_topic: /vlm_nav/behavior_costmap_raw
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.30
