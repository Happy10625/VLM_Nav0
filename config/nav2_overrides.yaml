global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.50
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      obstacle_layer:
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /vlm_nav/obstacle_cloud
          # Points are expressed in base_link after preprocessing, while
          # raytracing must start at the original FAST_LIO sensor origin.
          sensor_frame: body
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          # TODO(real-robot calibration): validate the shared height range.
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

planner_server:
  ros__parameters:
    GridBased:
      # Reserve 0.05 m for the controller so the combined native Nav2
      # tolerance cannot exceed the 0.81 m task-success radius.
      tolerance: 0.76
      use_final_approach_orientation: true
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.50
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.36, 0.25], [0.36, -0.25], [-0.36, -0.25], [-0.36, 0.25]]"
      footprint_padding: 0.03
      voxel_layer:
        # FAST_LIO may place the cloud origin a few centimetres below odom z=0.
        # Cover that origin so raytracing can clear stale obstacle cells.
        origin_z: -0.10
        z_resolution: 0.10
        z_voxels: 16
        observation_sources: fastlio_cloud
        fastlio_cloud:
          topic: /vlm_nav/obstacle_cloud
          # Points are expressed in base_link after preprocessing, while
          # raytracing must start at the original FAST_LIO sensor origin.
          sensor_frame: body
          data_type: PointCloud2
          marking: true
          clearing: true
          raytrace_min_range: 0.20
          raytrace_max_range: 8.0
          obstacle_min_range: 0.20
          obstacle_max_range: 7.5
          # TODO(real-robot calibration): validate the shared height range.
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50

controller_server:
  ros__parameters:
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.05
      stateful: true
    FollowPath:
      max_vel_x: 0.20
      max_vel_theta: 0.40
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.03
    progress_checker:
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

behavior_server:
  ros__parameters:
    # Humble Behavior Server consumes the same standard local costmap semantics
    # as the planner/controller obstacle chain; no copied or rewritten map.
    costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    max_rotational_vel: 0.25
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.30
